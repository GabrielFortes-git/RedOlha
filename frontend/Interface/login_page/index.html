<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   <title>Login</title>
   <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
   <link rel="stylesheet" href="loginPage.css">
</head>

<body>

  <!------------------------ LOGIN --------------------------->
   <div class="container login show" id="login">
       <div class="form-box">
           <div class="info-area">
                   <div class="logo">
                      <img src="../Resources/Images/RoH(1).png">
                   </div>
           </div>
           <div class="form-area">
               <form>
                   <h1>Login</h1>
                   <div class="input-box">
                       <input id="usernameLogin" type="text" placeholder="Username" name="usernameLogin" required>
                       <i class="bx bxs-user"></i>
                   </div>
                   <div class="input-box">
                       <input id="passwordLogin" type="password" placeholder="Password" name="passwordLogin" required>
                       <i class="bx bxs-lock-alt"></i>
                   </div>
                   <div class="link">
                       <a href="#">Forgot Password?</a>
                   </div>
                   <button id="loginBtn" type="button" name="loginBtn">Login</button>
                   <div class="link">
                       <p>Dont' have an account yet!</p>
                       <a id="registerAncor" href="#">Register</a>
                   </div>
               </form>
           </div>
       </div>
   </div>

<!----------------------------- REGISTER ----------------------------->
     <div class="container register" id="register">
       <div class="form-box register">
           <div class="form-area">
               <form>
                   <h1>Register</h1>
                   <div class="input-box">
                       <input id="usernameRegister" type="text" placeholder="Username" name="usernameRegister" required>
                       <i class="bx bxs-user"></i>
                   </div>
                    <div class="input-box">
                       <input id="emailRegister" type="email" placeholder="example@gmail.com" name="emailRegister" required>
                       <i class="bx bx-at"></i>
                   </div>
                   <div class="input-box">
                       <input id="passwordRegister" type="password" placeholder="Password" name="passwordRegister" required>
                       <i class="bx bxs-lock-alt"></i>
                   </div>
                   <div class="input-box">
                       <input id="confirmPasswordRegister" type="password" placeholder="Password Confirmation" name="confirmPasswordRegister" required>
                       <i class="bx bx-check-circle"></i>
                   </div>
                   <button id="registerBtn" type="button" name="registerBtn">Register</button>
                   <div class="link">
                       <p>Already has an account!</p>
                       <a id="loginAncor" href="#">Login</a>
                   </div>
               </form>
           </div>
           <div class="info-area">
                   <div class="logo">
                            <img src="../Resources/Images/RoH(9).png">
                   </div>
           </div>
       </div>
   </div>


<!-- 1. O elemento onde a animação vai aparecer -->
 <div class="background-animation-container">
        <div id="vanta-bg" class="s-page-1 s-section-1 s-section" style="width: 100%; height: 100vh;;"></div> 
 </div>

<!-- 2. As bibliotecas (Scripts externos) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script src="loginPage.js" defer></script>

<!-- 3. O Script de ativação -->
<script>
  // Esta função ativa o efeito
  var setVanta = () => {
    if (window.VANTA) {
      window.VANTA.NET({
        el: "#vanta-bg", // Usamos o ID para ser mais preciso
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0xe6e4d7,
        backgroundColor: 0x000000,
        points: 7.00,
        maxDistance: 24.00,
        spacing: 20.00
      })
    }
  }

  // Executa assim que a página carregar
  window.addEventListener('DOMContentLoaded', setVanta);
</script>

        <span>Failed to login! Username or password incorrect!</span>
   </div> -->


</body>
</html>
