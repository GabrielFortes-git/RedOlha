<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="admin_main_page.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!------------------------->
    <title>RedOlha-Admin</title>
</head>
<body>

   <div class="main-container">
    <!---------------  HEAD ----------------->
        <header class="header">
            <div class="header-area">
                <div class="logo">
                    <div class="logo-img">
                        <img src="../Resources/Images/Red0lha.svg">
                    </div>
                    <div class="logo-text">
                        <h1>RedOlha</h1>
                    </div>
                </div>
                <div class="middle">
                    <div class="page-tree">
                        <div>
                            <a href="admin_main_page.html">/Home</a>
                        </div>
                        <div>
                            <a href="admin_main_page.html">/. . .</a>
                        </div>
                    </div>
                </div>
                <div class="toolbar">
                    <div>
                        <i class="bx bx-search-alt"></i>
                    </div>
                    <div>
                       <i class="bx bx-user"></i>
                    </div>
                    <div>
                        <i class="bx bx-menu"></i>
                    </div>
                </div>
            </div>
        </header>
    <!---------------  MAIN ----------------->
        <main class="main">
            <div class="main-area">
                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">
                            <span>Agents</span>
                        </div>
                        <div class="stat-content">
                            <span style="color: orange">0000</span>
                        </div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">
                            <span>Active Agents</span>
                        </div>
                        <div class="stat-content">
                            <span style="color: rgb(42, 148, 42)">0000</span>
                        </div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">
                            <span>Network Devices</span> <!-- latência, largura de banda-->
                        </div>
                        <div class="stat-content">
                            <span style="color: rgb(81, 81, 189)">0000</span>
                          
                        </div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">
                            <span>Alerts</span>
                        </div>
                        <div class="stat-content">
                            <span style="color: rgb(202, 64, 64)">0000</span>
                        </div>
                    </div>
                </div>
                <div class="system-modules">
                    <div class="module module-monitoring">
                        <div class="module-content">
                            <div id="chart">

                    
                            </div>
                            <div></div>
                        </div>
                        <div class="module-link">
                            <img src="../Resources/icons/caret-big-right.svg">
                        </div>
                    </div>
                     <div class="module module-maintainanceManutencion">
                        <div class="module-content">
                            <div>
                                <!-- <img src="../Resources/Images/MaintainanceManutention.jpg"> -->
                            </div>
                            <div></div>
                        </div>
                        <div class="module-link">
                            <img src="../Resources/icons/caret-big-right.svg">
                        </div>
                     </div>
                      <div class="module module-sunetPlanning">
                        <div class="module-content">
                            <div></div>
                            <div></div>
                        </div>
                        <div class="module-link">
                            <img src="../Resources/icons/caret-big-right.svg">
                        </div>
                      </div>
                       <div class="module module-userManagement">
                        <div class="module-content">
                            <div></div>
                            <div></div>
                        </div>
                        <div class="module-link">
                            <img src="../Resources/icons/caret-big-right.svg">
                        </div>
                       </div>
                </div>
            </div>
            <div class="briefing">
               <div></div>
               <div></div>
            </div> 
        </main>

     <!---------------  ASIDE ----------------->

        <div class="aside">
             <div class="menu">
                <div>
                    <div>  <i class="bx bx-home"></i> </div>
                    <div> <i class="bx bx-table"></i> </div>
                    <div> <i class="bx bx-folder"></i> </div>
                    <div> <i class="bx bx-calculator"></i> </div>
                </div>
                <div>
                    <div>  <i class="bx bx-user"></i> </div>
                    <div>  <i class="bx bx-cog"></i> </div>
                </div>
            </div>
        </div>

    <!---------------  FOOTER ----------------->
        <footer class="footer">
            <div class="footer-area">

            </div>
        </footer>
   </div>

<!-------------------------------CHART--------------------------------------->
<script>
    var options = {
          series: [{
          name: 'series1',
          data: [31, 40, 28, 51, 42, 109, 100]
        }, {
          name: 'series2',
          data: [11, 32, 45, 32, 34, 52, 41]
        }],
          chart: {
          height: 250,
          type: 'area'
        },
        dataLabels: {
          enabled: false
        },
        stroke: {
          curve: 'smooth'
        },
        xaxis: {
          type: 'datetime',
          categories: ["2018-09-19T00:00:00.000Z", "2018-09-19T01:30:00.000Z", "2018-09-19T02:30:00.000Z", "2018-09-19T03:30:00.000Z", "2018-09-19T04:30:00.000Z", "2018-09-19T05:30:00.000Z", "2018-09-19T06:30:00.000Z"]
        },
        tooltip: {
          x: {
            format: 'dd/MM/yy HH:mm'
          },
        },
        };

        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
</script>
<!--------------------------------------------------------------------------->
</body>
</html>
